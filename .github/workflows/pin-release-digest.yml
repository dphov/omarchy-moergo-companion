name: Pin Release Tarball Digest

on:
  release:
    types: [published]

permissions:
  contents: write
  id-token: write
  attestations: read

jobs:
  pin-digest:
    name: Pin Release Tarball Digest to install.sh
    runs-on: ubuntu-latest
    if: ${{ !github.event.release.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          ref: main
          fetch-depth: 0

      - name: Install GitHub CLI
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
            sudo apt-get update
            sudo apt-get install -y gh
          fi
          gh --version

      - name: Download and verify release tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.release.tag_name }}"
          tarball="omarchy-moergo-companion-binaries-${tag}.tar.gz"
          url="https://github.com/${{ github.repository }}/releases/download/${tag}/${tarball}"

          echo "Downloading ${url}..."
          curl -fsSL \
            --connect-timeout 15 \
            --max-time 120 \
            --max-filesize 5M \
            -o "$tarball" "$url"

          echo "Verifying build attestation for ${tarball}..."
          gh attestation verify \
            --owner ${{ github.repository_owner }} \
            --predicate-type https://slsa.dev/provenance/v1 \
            "$tarball"

          digest="$(sha256sum "$tarball" | awk '{print $1}')"
          echo "TARBALL_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "TARBALL_TAG=${tag}" >> "$GITHUB_ENV"
          echo "Tarball digest: ${digest}"

      - name: Update install.sh with pinned digest
        run: |
          tag="$TARBALL_TAG"
          digest="$TARBALL_DIGEST"

          python3 - <<'PY'
          import re, sys
          tag = sys.argv[1]
          digest = sys.argv[2]
          path = "install.sh"
          content = open(path).read()

          # Remove any existing entry for this tag.
          content = re.sub(rf'\n\s*\["{re.escape(tag)}"\]="[^"]+"', '', content)

          # Insert the new entry before the closing ).
          def insert_before_close(match):
              return f'\n  ["{tag}"]="{digest}"\n)'
          content, count = re.subn(r'\n\)', insert_before_close, content, count=1)
          if count != 1:
              print("Error: could not find closing ) of RELEASE_TARBALL_DIGESTS", file=sys.stderr)
              sys.exit(1)

          open(path, "w").write(content)
          PY
          "$tag" "$digest"

          echo "Updated install.sh:"
          grep -F "\"$tag\"" install.sh

      - name: Commit and push digest pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet install.sh; then
            echo "install.sh is already up to date for $TARBALL_TAG. Nothing to commit."
            exit 0
          fi

          git add install.sh
          git commit -m "chore(release): pin tarball digest for ${TARBALL_TAG} [ci skip]"
          git push origin main
