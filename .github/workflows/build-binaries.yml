name: Build & Verify Binaries

on:
  push:
    branches: [ main ]
    paths:
      - 'keymap-parser/**'
      - '.github/workflows/build-binaries.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'keymap-parser/**'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.98.1

      - name: Build release binaries from locked source
        run: |
          cd keymap-parser
          rustup target add x86_64-unknown-linux-musl
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME=/home" \
            cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Stage binaries into bin/
        run: |
          mkdir -p bin
          cp keymap-parser/target/x86_64-unknown-linux-musl/release/omarchy-moergo-keymap-parser bin/
          cp keymap-parser/target/x86_64-unknown-linux-musl/release/moergo-watcher bin/
          cp keymap-parser/target/x86_64-unknown-linux-musl/release/moergo-companion-settings bin/
          cp keymap-parser/target/x86_64-unknown-linux-musl/release/glove80-status bin/

      - name: Generate and verify SHA-256 manifest
        run: |
          cd bin
          # Deterministic, sorted manifest: one line per binary in lexicographic order.
          for bin in glove80-status moergo-companion-settings moergo-watcher omarchy-moergo-keymap-parser; do
            printf '%s\0' "$bin"
          done | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: bin/*
          show-summary: true

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omarchy-moergo-companion-binaries-${{ github.run_id }}
          path: bin/*
          if-no-files-found: error
          retention-days: 30
