name: Build & Commit Binaries

on:
  push:
    branches: [ main ]
    paths:
      - 'keymap-parser/**'
      - '.github/workflows/build-binaries.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'keymap-parser/**'
      - '.github/workflows/build-binaries.yml'
  workflow_dispatch:

jobs:
  build-and-verify:
    name: Build & Verify Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.98.1

      - name: Build release binaries from locked source
        run: |
          cd keymap-parser
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME=/home" \
            cargo build --release --locked

      - name: Stage binaries into bin/
        run: |
          mkdir -p bin
          cp keymap-parser/target/release/omarchy-moergo-keymap-parser bin/
          cp keymap-parser/target/release/moergo-watcher bin/
          cp keymap-parser/target/release/moergo-companion-settings bin/
          cp keymap-parser/target/release/glove80-status bin/

      - name: Generate and verify SHA-256 manifest
        run: |
          cd bin
          sha256sum glove80-status moergo-companion-settings moergo-watcher omarchy-moergo-keymap-parser > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: bin/*
          show-summary: true

      - name: Verify binaries match in Pull Requests
        if: github.event_name == 'pull_request'
        run: |
          git add -f bin/
          if ! git diff --cached --quiet; then
            echo "::error::The committed binaries in bin/ do not match the compiled output from keymap-parser/."
            git diff --cached bin/
            exit 1
          fi

      - name: Commit and push verified binaries
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          git add -f bin/
          if git diff --cached --quiet; then
            echo "Binaries in bin/ are already up-to-date and match source."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(ci): update release binaries [skip ci]" \
              -m "Build provenance: compiled on GitHub Actions run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} from locked source at commit ${{ github.sha }}." \
              -m "Verify with: gh attestation verify --owner ${{ github.repository_owner }} --predicate-type https://slsa.dev/provenance/v1 bin/<binary>"
            git push
          fi
