name: Release Dry-Run

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/release-dry.yml'
      - '.github/workflows/prepare-release.yml'
      - '.github/actions/build-release-tarball/**'
      - 'keymap-parser/**'
      - 'justfile'

jobs:
  dry-run:
    name: Build and preview release tarball digest
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Ensure SOURCE_DATE_EPOCH is present
        run: |
          if [ ! -f SOURCE_DATE_EPOCH ]; then
            echo "Error: SOURCE_DATE_EPOCH file is missing." >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$(cat SOURCE_DATE_EPOCH)" >> "$GITHUB_ENV"

      - name: Build release tarball
        id: build
        uses: ./.github/actions/build-release-tarball
        with:
          source-date-epoch: ${{ env.SOURCE_DATE_EPOCH }}
          tarball-name: omarchy-moergo-companion-binaries-dryrun.tar.gz

      - name: Print digest
        run: |
          echo ""
          echo "=== CI dry-run tarball digest ==="
          echo "${{ steps.build.outputs.tarball-digest }}  omarchy-moergo-companion-binaries-dryrun.tar.gz"
          echo ""
          echo "=== internal SHA256SUMS ==="
          cat <<'EOF'
          ${{ steps.build.outputs.sha256sums }}
          EOF

      - name: Upload dry-run tarball as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: omarchy-moergo-companion-binaries-dryrun
          path: omarchy-moergo-companion-binaries-dryrun.tar.gz
          if-no-files-found: error
          retention-days: 5
