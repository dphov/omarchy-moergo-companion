name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Lint & Test Rust parser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check formatting
        run: cd keymap-parser && cargo fmt --check

      - name: Run clippy
        run: cd keymap-parser && cargo clippy --locked --all-targets -- -D warnings

      - name: Run test suite
        run: cd keymap-parser && cargo test --locked --verbose
