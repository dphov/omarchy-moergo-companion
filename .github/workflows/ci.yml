name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust:
    name: Lint & Test Rust parser
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt

      - name: Check formatting
        run: cd keymap-parser && cargo fmt --check

      - name: Run clippy
        run: cd keymap-parser && cargo clippy --locked --all-targets -- -D warnings

      - name: Run test suite
        run: cd keymap-parser && cargo test --locked --verbose
