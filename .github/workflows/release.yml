name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify committed binaries match SHA256SUMS
        working-directory: bin
        run: sha256sum -c SHA256SUMS

      - name: Copy binaries and recompute checksums
        id: checksum
        working-directory: bin
        run: |
          cp omarchy-moergo-keymap-parser moergo-watcher moergo-companion-settings glove80-status SHA256SUMS ../release-assets/
          cd ../release-assets
          tar -czvf "omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz" \
            omarchy-moergo-keymap-parser moergo-watcher moergo-companion-settings glove80-status SHA256SUMS
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS
          {
            echo 'body<<EOF'
            cat SHA256SUMS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          body: |
            ### Verifying Binary Provenance

            All release binaries are compiled directly from the reviewed, locked Rust source (`Cargo.lock`) on GitHub Actions and committed to `bin/` on every source change.
            To verify that your downloaded binaries match the published release assets:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ### Checksums

            SHA-256 values for the assets in this release are listed below and also bundled in the attached `SHA256SUMS` file.

            ${{ steps.checksum.outputs.body }}
