name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Ensure SOURCE_DATE_EPOCH is present
        run: |
          if [ ! -f SOURCE_DATE_EPOCH ]; then
            echo "Error: SOURCE_DATE_EPOCH file is missing. Commit it with the release digest." >&2
            exit 1
          fi
          echo "SOURCE_DATE_EPOCH=$(cat SOURCE_DATE_EPOCH)" >> "$GITHUB_ENV"

      - name: Build release tarball
        id: build
        uses: ./.github/actions/build-release-tarball
        with:
          source-date-epoch: ${{ env.SOURCE_DATE_EPOCH }}
          tarball-name: omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz
          reproducibility-check: "true"

      - name: Write root SHA256SUMS for release assets
        env:
          TARBALL_DIGEST: ${{ steps.build.outputs.tarball-digest }}
        run: |
          echo "${TARBALL_DIGEST}  omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz" > SHA256SUMS

      - name: Ensure CHANGELOG.md is present
        run: test -f CHANGELOG.md

      - name: Verify tag contains committed source SHA
        env:
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Extract the full SHA of the reviewed source snapshot for this tag.
          expected_sha="$(grep -F "[\"$RELEASE_TAG\"]=" install.sh | grep -v '[0-9a-f]\{64\}' | sed -E 's/.*\"([0-9a-f]{40})\".*/\1/')"
          if [ -z "$expected_sha" ]; then
            echo "Error: no committed source SHA for $RELEASE_TAG in install.sh." >&2
            echo "Run 'just prepare-release $RELEASE_TAG', merge the PR, then push the tag." >&2
            exit 1
          fi
          tag_commit="$(git rev-list -n1 \"$RELEASE_TAG\")"
          # The committed source SHA is the reviewed tree the release was prepared from.
          # The tag may include later merge/metadata commits, so verify ancestry rather
          # than exact equality. The tarball digest check below provides the exact binding.
          if ! git merge-base --is-ancestor "$expected_sha" "$tag_commit"; then
            echo "Error: tag $RELEASE_TAG ($tag_commit) does not contain the reviewed source SHA $expected_sha." >&2
            echo "The release does not match the reviewed source snapshot; refusing to publish." >&2
            exit 1
          fi
          if [ "$SOURCE_SHA" != "$tag_commit" ]; then
            echo "Error: release build source $SOURCE_SHA differs from tag commit $tag_commit." >&2
            exit 1
          fi
          echo "Tag $RELEASE_TAG ($tag_commit) contains reviewed source SHA $expected_sha."

      - name: Attest release assets
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            omarchy-moergo-companion-binaries-*.tar.gz
            SHA256SUMS
          show-summary: true

      - name: Extract changelog section for this release
        id: changelog
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          section=$(awk '/^## \['"$version"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)
          if [ -z "$section" ]; then
            section="_No CHANGELOG.md entry found for ${{ github.ref_name }}."
          fi
          {
            echo 'body<<EOF'
            echo "$section"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          files: |
            omarchy-moergo-companion-binaries-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.body }}

            ### Verifying Binary Provenance

            All release binaries are compiled directly from the reviewed, locked Rust source (`keymap-parser/Cargo.lock`) on GitHub Actions and packaged as a single tarball with an internal `SHA256SUMS` manifest. Each release produces signed Sigstore-compatible attestations stored by GitHub.

            To download and verify the tarball:

            ```bash
            tag=${{ github.ref_name }}
            curl -fsSL -O "https://github.com/${{ github.repository }}/releases/download/${tag}/omarchy-moergo-companion-binaries-${tag}.tar.gz"

            # Compare the digest to the value pinned in install.sh
            sha256sum "omarchy-moergo-companion-binaries-${tag}.tar.gz"
            grep "\"${tag}\"" install.sh

            mkdir -p bin
            tar -xzf "omarchy-moergo-companion-binaries-${tag}.tar.gz" -C bin
            sha256sum -c bin/SHA256SUMS
            ```

            To verify signed build provenance for the tarball:

            ```bash
            gh attestation verify \
              --repo ${{ github.repository }} \
              --signer-workflow ${{ github.repository }}/.github/workflows/release.yml \
              --predicate-type https://slsa.dev/provenance/v1 \
              omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz
            ```

            ### Checksums

            SHA-256 values for the binaries inside the tarball are listed below and also bundled in the tarball's `SHA256SUMS` file.

            ${{ steps.build.outputs.sha256sums }}

      - name: Verify committed tarball digest matches release artifact
        env:
          TARBALL_DIGEST: ${{ steps.build.outputs.tarball-digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TARBALL_DIGEST" ]; then
            echo "Error: tarball digest is missing." >&2
            exit 1
          fi

          expected_digest="$(grep -F "\"$RELEASE_TAG\"" install.sh | head -n1 | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          if [ -z "$expected_digest" ]; then
            echo "Error: no committed digest in install.sh for $RELEASE_TAG." >&2
            echo "Run 'just prepare-release $RELEASE_TAG' to open a PR with the digest, merge it, then push the tag." >&2
            exit 1
          fi

          if [ "$TARBALL_DIGEST" != "$expected_digest" ]; then
            echo "Error: release tarball digest does not match the value committed in install.sh." >&2
            echo "  expected (from install.sh): $expected_digest" >&2
            echo "  actual (release artifact):  $TARBALL_DIGEST" >&2
            exit 1
          fi

          echo "Release artifact digest matches install.sh: $TARBALL_DIGEST"
