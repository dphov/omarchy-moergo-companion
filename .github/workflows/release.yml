name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run test suite
        run: |
          cd keymap-parser
          cargo test --locked --verbose

      - name: Compile release binaries from locked source
        run: |
          cd keymap-parser
          cargo build --release --locked

      - name: Stage release artifacts & generate SHA-256 checksums
        id: checksum
        working-directory: release-assets
        run: |
          cp ../keymap-parser/target/release/omarchy-moergo-keymap-parser .
          cp ../keymap-parser/target/release/moergo-watcher .
          cp ../keymap-parser/target/release/moergo-companion-settings .
          cp ../keymap-parser/target/release/glove80-status .

          # Generate SHA-256 sums for the binaries
          sha256sum omarchy-moergo-keymap-parser moergo-watcher moergo-companion-settings glove80-status > SHA256SUMS

          # Package archive for offline distribution (includes binaries + checksums)
          tar -czvf "omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz" omarchy-moergo-keymap-parser moergo-watcher moergo-companion-settings glove80-status SHA256SUMS

          # Verify all final assets (binaries, archive, and SHA256SUMS) match
          sha256sum * > SHA256SUMS
          sha256sum -c SHA256SUMS

          # Prepare checksum block for release body
          {
            echo 'body<<EOF'
            cat SHA256SUMS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          body: |
            ### Verifying Binary Provenance

            All release binaries are compiled directly from the reviewed, locked Rust source (`Cargo.lock`) on GitHub Actions.
            To verify that your downloaded binaries mathematically match the published release assets:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ### Checksums

            SHA-256 values for the binaries in this release are listed below and also bundled in the attached `SHA256SUMS` file.

            ${{ steps.checksum.outputs.body }}
