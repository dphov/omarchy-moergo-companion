name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.98.1

      - name: Build release binaries from locked source
        run: |
          cd keymap-parser
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME=/home" \
            cargo build --release --locked

      - name: Stage binaries and generate internal SHA-256 manifest
        run: |
          mkdir -p dist/bin
          cp keymap-parser/target/release/omarchy-moergo-keymap-parser dist/bin/
          cp keymap-parser/target/release/moergo-watcher dist/bin/
          cp keymap-parser/target/release/moergo-companion-settings dist/bin/
          cp keymap-parser/target/release/glove80-status dist/bin/
          cd dist/bin
          # Deterministic, sorted manifest: one line per binary in lexicographic order.
          for bin in glove80-status moergo-companion-settings moergo-watcher omarchy-moergo-keymap-parser; do
            printf '%s\0' "$bin"
          done | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Ensure CHANGELOG.md is present
        run: test -f CHANGELOG.md

      - name: Package release tarball and verify reproducibility
        id: checksum
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          tarball="omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz"
          cd dist/bin

          # Deterministic tarball: sorted entries, fixed mtime/owner, no gzip timestamp.
          pack() {
            local out="$1"
            GZIP=-n tar \
              --sort=name \
              --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              --pax-option=exthdr.name=%d/PaxHeaders/%f,delete=atime,delete=ctime \
              -czf "$out" .
          }

          pack "../../$tarball"
          # Reproducibility invariant: repacking the same directory must yield the same digest.
          pack "../../reproducibility-check.tar.gz"
          cd ../..

          expected="$(sha256sum "$tarball" | awk '{print $1}')"
          actual="$(sha256sum reproducibility-check.tar.gz | awk '{print $1}')"
          if [[ "$expected" != "$actual" ]]; then
            echo "Error: release tarball is not reproducible." >&2
            echo "  first:  $expected" >&2
            echo "  second: $actual" >&2
            exit 1
          fi
          echo "Reproducibility check passed: $expected"

          sha256sum "$tarball" > SHA256SUMS
          sha256sum -c SHA256SUMS
          {
            echo 'body<<EOF'
            cat dist/bin/SHA256SUMS
            echo 'EOF'
            echo "tarball_digest=${expected}"
          } >> "$GITHUB_OUTPUT"

      - name: Attest release assets
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            omarchy-moergo-companion-binaries-*.tar.gz
            SHA256SUMS
          show-summary: true

      - name: Extract changelog section for this release
        id: changelog
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          section=$(awk '/^## \['"$version"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)
          if [ -z "$section" ]; then
            section="_No CHANGELOG.md entry found for ${{ github.ref_name }}."
          fi
          {
            echo 'body<<EOF'
            echo "$section"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          files: |
            omarchy-moergo-companion-binaries-*.tar.gz
            SHA256SUMS
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.body }}

            ### Verifying Binary Provenance

            All release binaries are compiled directly from the reviewed, locked Rust source (`keymap-parser/Cargo.lock`) on GitHub Actions and packaged as a single tarball with an internal `SHA256SUMS` manifest. Each release produces signed Sigstore-compatible attestations stored by GitHub.

            To download and verify the tarball:

            ```bash
            tag=${{ github.ref_name }}
            curl -fsSL -O "https://github.com/${{ github.repository }}/releases/download/${tag}/omarchy-moergo-companion-binaries-${tag}.tar.gz"

            # Compare the digest to the value pinned in install.sh
            sha256sum "omarchy-moergo-companion-binaries-${tag}.tar.gz"
            grep "\"${tag}\"" install.sh

            mkdir -p bin
            tar -xzf "omarchy-moergo-companion-binaries-${tag}.tar.gz" -C bin
            sha256sum -c bin/SHA256SUMS
            ```

            To verify signed build provenance for the tarball:

            ```bash
            gh attestation verify --owner ${{ github.repository_owner }} --predicate-type https://slsa.dev/provenance/v1 omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz
            ```

            ### Checksums

            SHA-256 values for the binaries inside the tarball are listed below and also bundled in the tarball's `SHA256SUMS` file.

            ${{ steps.checksum.outputs.body }}

      - name: Verify committed tarball digest matches release artifact
        env:
          TARBALL_DIGEST: ${{ steps.checksum.outputs.tarball_digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$TARBALL_DIGEST" ]; then
            echo "Error: tarball digest is missing." >&2
            exit 1
          fi

          expected_digest="$(grep -F "\"$RELEASE_TAG\"" install.sh | head -n1 | sed -E 's/.*\"([^\"]+)\".*/\1/')"
          if [ -z "$expected_digest" ]; then
            echo "Error: no committed digest in install.sh for $RELEASE_TAG." >&2
            echo "Run 'just release-dry' locally, commit the digest, then tag." >&2
            exit 1
          fi

          if [ "$TARBALL_DIGEST" != "$expected_digest" ]; then
            echo "Error: release tarball digest does not match the value committed in install.sh." >&2
            echo "  expected (from install.sh): $expected_digest" >&2
            echo "  actual (release artifact):  $TARBALL_DIGEST" >&2
            exit 1
          fi

          echo "Release artifact digest matches install.sh: $TARBALL_DIGEST"
