name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    name: Build & Publish Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: 1.98.1

      - name: Build release binaries from locked source
        run: |
          cd keymap-parser
          RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$HOME=/home" \
            cargo build --release --locked

      - name: Stage binaries and generate SHA-256 manifest
        run: |
          mkdir -p bin
          cp keymap-parser/target/release/omarchy-moergo-keymap-parser bin/
          cp keymap-parser/target/release/moergo-watcher bin/
          cp keymap-parser/target/release/moergo-companion-settings bin/
          cp keymap-parser/target/release/glove80-status bin/
          cd bin
          sha256sum glove80-status moergo-companion-settings moergo-watcher omarchy-moergo-keymap-parser > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Attest release binaries
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: bin/*
          show-summary: true

      - name: Ensure CHANGELOG.md is present
        run: test -f CHANGELOG.md

      - name: Package release assets
        id: checksum
        run: |
          mkdir -p release-assets
          cp bin/omarchy-moergo-keymap-parser bin/moergo-watcher bin/moergo-companion-settings bin/glove80-status release-assets/
          cp bin/SHA256SUMS release-assets/SHA256SUMS-source-binaries
          cd release-assets
          tar -czvf "omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz" \
            omarchy-moergo-keymap-parser moergo-watcher moergo-companion-settings glove80-status
          sha256sum omarchy-moergo-keymap-parser moergo-watcher moergo-companion-settings glove80-status "omarchy-moergo-companion-binaries-${{ github.ref_name }}.tar.gz" > SHA256SUMS
          sha256sum -c SHA256SUMS
          {
            echo 'body<<EOF'
            cat SHA256SUMS
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Extract changelog section for this release
        id: changelog
        run: |
          version="${{ github.ref_name }}"
          version="${version#v}"
          section=$(awk '/^## \['"$version"'\]/{flag=1; next} /^## \[/{flag=0} flag' CHANGELOG.md)
          if [ -z "$section" ]; then
            section="_No CHANGELOG.md entry found for ${{ github.ref_name }}."
          fi
          {
            echo 'body<<EOF'
            echo "$section"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94b41bd0b71bbee6b8 # v2.0.9
        with:
          files: |
            release-assets/*
          generate_release_notes: true
          body: |
            ${{ steps.changelog.outputs.body }}

            ### Verifying Binary Provenance

            All release binaries are compiled directly from the reviewed, locked Rust source (`keymap-parser/Cargo.lock`) on GitHub Actions. Each release produces signed Sigstore-compatible attestations stored by GitHub.

            To verify that a downloaded binary matches the attested build:

            ```bash
            gh attestation verify --owner ${{ github.repository_owner }} --predicate-type https://slsa.dev/provenance/v1 omarchy-moergo-keymap-parser
            gh attestation verify --owner ${{ github.repository_owner }} --predicate-type https://slsa.dev/provenance/v1 moergo-watcher
            gh attestation verify --owner ${{ github.repository_owner }} --predicate-type https://slsa.dev/provenance/v1 moergo-companion-settings
            gh attestation verify --owner ${{ github.repository_owner }} --predicate-type https://slsa.dev/provenance/v1 glove80-status
            ```

            You can also verify the local checksums with:

            ```bash
            sha256sum -c SHA256SUMS
            ```

            ### Checksums

            SHA-256 values for the assets in this release are listed below and also bundled in the attached `SHA256SUMS` file.

            ${{ steps.checksum.outputs.body }}
