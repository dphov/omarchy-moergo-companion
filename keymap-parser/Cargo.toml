[package]
name = "omarchy-moergo-keymap-parser"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "ZMK keymap and Glove80 layout-editor JSON parser for Omarchy MoErgo Companion"
license = "MIT"

[[bin]]
name = "omarchy-moergo-keymap-parser"
path = "src/main.rs"

[[bin]]
name = "moergo-watcher"
path = "src/bin/watcher.rs"

[[bin]]
name = "moergo-companion-settings"
path = "src/bin/settings.rs"

[[bin]]
name = "glove80-status"
path = "src/bin/status.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shellexpand = "3.0"
tempfile = "3.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
serde_json = "1.0"
